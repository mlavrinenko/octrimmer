name: ci

on:
    push:
        branches: [main]
    pull_request:
    workflow_call:

jobs:
    gate:
        runs-on: ubuntu-latest
        steps:
            # Full history, for gitleaks.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            # accept-flake-config takes qahq's Cachix from flake.nix, so jscpd
            # and outdatty arrive prebuilt.
            - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
              with:
                  extra_nix_config: accept-flake-config = true
            - run: nix develop -c npm ci --no-audit --no-fund --loglevel=error
            - run: nix develop -c just ci
            - run: nix flake check
